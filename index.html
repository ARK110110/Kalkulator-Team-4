<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Desktop Tailwind</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen select-none">

    <!-- Container Kalkulator Desktop -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-80 border border-slate-700">
        
        <!-- Layar Kalkulator -->
        <div class="mb-5 bg-slate-950 p-4 rounded-xl text-right border border-slate-800">
            <div id="previous-operand" class="text-slate-500 text-sm h-6 overflow-hidden"></div>
            <div id="current-operand" class="text-white text-3xl font-semibold tracking-wider overflow-hidden">0</div>
        </div>

        <!-- Keypad / Tombol Kalkulator -->
        <div class="grid grid-cols-4 gap-3">
            <!-- Baris 1 -->
            <button onclick="clearDisplay()" class="col-span-2 bg-rose-600 hover:bg-rose-500 text-white font-medium py-3 rounded-xl transition active:scale-95">AC</button>
            <button onclick="deleteDigit()" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">DEL</button>
            <button onclick="appendOperation('/')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 rounded-xl transition active:scale-95">÷</button>

            <!-- Baris 2 -->
            <button onclick="appendNumber('7')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">7</button>
            <button onclick="appendNumber('8')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">8</button>
            <button onclick="appendNumber('9')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">9</button>
            <button onclick="appendOperation('*')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 rounded-xl transition active:scale-95">×</button>

            <!-- Baris 3 -->
            <button onclick="appendNumber('4')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">4</button>
            <button onclick="appendNumber('5')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">5</button>
            <button onclick="appendNumber('6')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">6</button>
            <button onclick="appendOperation('-')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 rounded-xl transition active:scale-95">-</button>

            <!-- Baris 4 -->
            <button onclick="appendNumber('1')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">1</button>
            <button onclick="appendNumber('2')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">2</button>
            <button onclick="appendNumber('3')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">3</button>
            <button onclick="appendOperation('+')" class="bg-amber-600 hover:bg-amber-500 text-white font-medium py-3 rounded-xl transition active:scale-95">+</button>

            <!-- Baris 5 -->
            <button onclick="appendNumber('0')" class="col-span-2 bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">0</button>
            <button onclick="appendNumber('.')" class="bg-slate-700 hover:bg-slate-600 text-white font-medium py-3 rounded-xl transition active:scale-95">.</button>
            <button onclick="compute()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-xl transition active:scale-95">=</button>
        </div>

    </div>

    <!-- Menghubungkan File JavaScript -->
    <script src="script.js"></script>
</body>
</html>
